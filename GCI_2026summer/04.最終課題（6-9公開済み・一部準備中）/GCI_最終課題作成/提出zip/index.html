<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S社従業員離職予測ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .input-field {
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }
        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            outline: none;
        }
        .btn-predict {
            background: linear-gradient(to right, #2563eb, #3b82f6);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .result-gradient {
            background: conic-gradient(#3b82f6 var(--percentage), #e2e8f0 0);
        }
    </style>
</head>
<body class="py-12 px-4">
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-slate-800 mb-4">S社従業員離職予測ツール</h1>
            <p class="text-slate-600 max-w-2xl mx-auto">
                最新の勾配ブースティング（Gradient Boosting）アルゴリズムを用いて、従業員の離職リスクを0から1の範囲で精密に予測します。
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Input Form -->
            <div class="lg:col-span-2 glass-card p-8">
                <form id="predictionForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Dynamic fields will be inserted here -->
                </form>
                <div class="mt-8 pt-6 border-t border-slate-200">
                    <button type="button" onclick="predict()" class="w-full py-4 text-white font-bold rounded-xl btn-predict text-lg">
                        離職可能性を予測する
                    </button>
                </div>
            </div>

            <!-- Result Panel -->
            <div class="lg:col-span-1 space-y-8">
                <div class="glass-card p-8 text-center sticky top-8">
                    <h2 class="text-xl font-bold text-slate-800 mb-6">予測結果</h2>
                    
                    <div class="relative w-48 h-48 mx-auto mb-6">
                        <div id="resultChart" class="w-full h-full rounded-full result-gradient flex items-center justify-center" style="--percentage: 0%">
                            <div class="w-40 h-40 bg-white rounded-full flex flex-center items-center justify-center flex-col">
                                <span id="resultValue" class="text-4xl font-bold text-slate-800">0.00</span>
                                <span class="text-xs text-slate-400 mt-1">PROBABILITY</span>
                            </div>
                        </div>
                    </div>

                    <div id="resultMessage" class="text-slate-600 text-sm leading-relaxed">
                        データを入力して「予測する」ボタンを押してください。
                    </div>

                    <div class="mt-6 pt-6 border-t border-slate-100">
                        <div class="flex justify-between text-xs font-bold text-slate-400 mb-2">
                            <span>定着 (0.0)</span>
                            <span>離職 (1.0)</span>
                        </div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                            <div id="resultBar" class="bg-blue-500 h-full transition-all duration-1000" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        function predict() {
            const formData = new FormData(form);
            const inputData = {};
            
            // Encode input data
            modelData.feature_names.forEach(feature => {
                if (feature.includes('_')) {
                    const [col, val] = feature.split('_');
                    inputData[feature] = formData.get(col) === val ? 1 : 0;
                } else {
                    inputData[feature] = parseFloat(formData.get(feature));
                }
            });

            // Gradient Boosting Inference
            let score = modelData.init_value;
            modelData.trees.forEach(tree => {
                score += modelData.learning_rate * traverseTree(tree, inputData);
            });

            // Sigmoid for probability
            const probability = 1 / (1 + Math.exp(-score));
            
            updateUI(probability);
        }

        function traverseTree(node, data) {
            if (node.type === 'leaf') return node.value;
            const val = data[node.feature];
            if (val <= node.threshold) {
                return traverseTree(node.left, data);
            } else {
                return traverseTree(node.right, data);
            }
        }

        function updateUI(prob) {
            const valEl = document.getElementById('resultValue');
            const barEl = document.getElementById('resultBar');
            const chartEl = document.getElementById('resultChart');
            const msgEl = document.getElementById('resultMessage');

            const percentage = (prob * 100).toFixed(1);
            
            // Animate value
            let current = 0;
            const step = prob / 50;
            const interval = setInterval(() => {
                current += step;
                if (current >= prob) {
                    valEl.innerText = prob.toFixed(3);
                    clearInterval(interval);
                } else {
                    valEl.innerText = current.toFixed(3);
                }
            }, 20);

            barEl.style.width = percentage + '%';
            chartEl.style.setProperty('--percentage', percentage + '%');

            if (prob < 0.3) {
                msgEl.innerText = "離職リスクは非常に低いです。従業員は現状に満足している可能性が高いです。";
                barEl.className = "bg-green-500 h-full transition-all duration-1000";
            } else if (prob < 0.6) {
                msgEl.innerText = "中程度の離職リスクがあります。面談などのフォローアップを検討してください。";
                barEl.className = "bg-yellow-500 h-full transition-all duration-1000";
            } else {
                msgEl.innerText = "離職リスクが高い状態です。早急な状況確認と対策が必要です。";
                barEl.className = "bg-red-500 h-full transition-all duration-1000";
            }
        }
